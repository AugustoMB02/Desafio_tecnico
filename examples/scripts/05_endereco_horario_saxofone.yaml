title: "Exemplo 5 — Três perguntas numa só mensagem: endereço, feriado e saxofone"
now: "2026-11-17T10:00:00-04:00"
notes: >
  Terça-feira, 17/11/2026, 10h, loja aberta. Uma única mensagem com três pedidos de naturezas
  diferentes — o endereço (manual de políticas), se a loja abre no feriado de 20/11 (calendário)
  e saxofone (catálogo: a categoria existe na loja, mas está sem itens) —, que o agente responde
  na ordem, consultando uma fonte para cada um. Depois, o registro de interesse do cliente,
  aberto só depois de ele confirmar o resumo.
turns:
  - "Oi! Três coisas: qual o endereço da loja, vocês abrem no dia 20 de novembro, e vocês têm saxofone?"
  - "Quero sim, meu telefone é (67) 99111-2233"
  - "Isso, pode registrar!"
