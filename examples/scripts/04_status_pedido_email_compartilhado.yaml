title: "Exemplo 4 — Status do pedido com e-mail compartilhado entre dois clientes"
now: "2026-03-02T14:30:00-04:00"
notes: >
  Segunda-feira, 14h30, loja aberta. O e-mail bruno.martins@jmail.com pertence a dois cadastros
  (clientes 11 e 43). A verificação exige dois dados e confere a combinação inteira, então o
  e-mail sozinho não basta e o telefone resolve para o cliente certo. O pedido 10 foi confirmado
  há cinco dias e ainda não foi despachado: o agente informa o status e explica que o código de
  rastreio chega por e-mail e WhatsApp quando o pedido for enviado, sem inventar uma data.
turns:
  - "Boa tarde, queria saber do meu pedido. Meu e-mail é bruno.martins@jmail.com"
  - "Meu telefone é (67) 98543-2109"
  - "E quando ele chega? Moro em Três Lagoas."
  - "Beleza, obrigado!"
